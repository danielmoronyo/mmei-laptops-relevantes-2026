      <stop offset="45%" stop-color="#9a3412"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="g-rail" x1="0%" y1="0%" x2="0%" y2="100%">
