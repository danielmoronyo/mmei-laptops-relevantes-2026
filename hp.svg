    <rect x="78" y="14" width="310" height="76" rx="3" fill="url(#g-screen-victus)" stroke="#0f172a" stroke-width="1"/>
    <!-- Icono geométrico Victus "V" en el fondo de pantalla -->
    <polygon points="233,35 255,68 245,68 233,48 221,68 211,68" fill="rgba(255,255,255,0.25)"/>
    <text x="375" y="26" font-size="5" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" fill="#38bdf8" text-anchor="end">144 Hz IPS</text>
    <rect x="78" y="84" width="310" height="6" fill="rgba(10,14,24,0.7)"/>

    <!-- Cámara HP Wide Vision 720p -->
