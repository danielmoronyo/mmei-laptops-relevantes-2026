    <circle cx="233" cy="10.5" r="1" fill="#38bdf8"/>
    <circle cx="218" cy="10.5" r="0.8" fill="#000"/>
    <circle cx="248" cy="10.5" r="0.8" fill="#000"/>
    <text x="233" y="81" font-size="5.5" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" fill="#cbd5e1" text-anchor="middle">VICTUS</text>
  </g>

