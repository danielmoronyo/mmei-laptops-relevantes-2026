      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="g-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="15%" stop-color="#1c1f26"/>
      <stop offset="85%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#0d0e12"/>
