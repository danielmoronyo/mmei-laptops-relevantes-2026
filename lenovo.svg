    <circle cx="233" cy="10.5" r="1" fill="#38bdf8"/>
    <rect x="227" y="9" width="4" height="3" rx="0.5" fill="#ff6000"/>
    <!-- Micrófonos duales -->
    <circle cx="218" cy="10.5" r="0.8" fill="#000"/>
    <circle cx="248" cy="10.5" r="0.8" fill="#000"/>
    <text x="233" y="81" font-size="5" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" fill="#94a3b8" text-anchor="middle">Lenovo</text>
  </g>

