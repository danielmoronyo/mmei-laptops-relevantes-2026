    <rect x="78" y="84" width="310" height="6" fill="rgba(10,14,24,0.7)"/>
    <rect x="220" y="85" width="4" height="4" rx="0.5" fill="#38bdf8"/>
    <rect x="228" y="85" width="4" height="4" rx="0.5" fill="#38bdf8"/>
    <rect x="236" y="85" width="4" height="4" rx="0.5" fill="#38bdf8"/>
    <rect x="244" y="85" width="4" height="4" rx="0.5" fill="#38bdf8"/>
