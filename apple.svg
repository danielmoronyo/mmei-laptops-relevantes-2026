<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 388" width="466" height="388">
  <defs>
    <linearGradient id="g-mac-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3440"/>
      <stop offset="45%" stop-color="#1d212a"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="g-screen-mac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="15%" stop-color="#1c1f26"/>
      <stop offset="85%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="f-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="466" height="388" rx="8" fill="#0e121a" stroke="#1e2433" stroke-width="1.5"/>
  <line x1="10" y1="228" x2="456" y2="228" stroke="rgba(255,96,0,0.3)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 1. VISTA SUPERIOR DEL MACBOOK AIR (M2 / M3) -->
  <!-- Marco de Pantalla Liquid Retina -->
  <g filter="url(#f-shadow)">
    <rect x="70" y="6" width="326" height="92" rx="6" fill="url(#g-mac-chassis)" stroke="#475569" stroke-width="1"/>
    <!-- Pantalla Liquid Retina encendida -->
    <rect x="78" y="14" width="310" height="76" rx="3" fill="url(#g-screen-mac)" stroke="#0f172a" stroke-width="1"/>
    <!-- Curva de onda macOS -->
    <path d="M 78 80 Q 233 40 388 85 L 388 90 L 78 90 Z" fill="rgba(255,255,255,0.18)"/>

    <!-- Dock inferior macOS -->
    <rect x="180" y="84" width="106" height="4" rx="2" fill="rgba(255,255,255,0.45)"/>

    <!-- Notch característico con Cámara FaceTime HD 1080p -->
    <path d="M 220 14 L 220 21 Q 220 23 223 23 L 243 23 Q 246 23 246 21 L 246 14 Z" fill="#000000"/>
    <circle cx="233" cy="18" r="1.8" fill="#1e293b" stroke="#38bdf8" stroke-width="0.6"/>
    <circle cx="239" cy="18" r="0.8" fill="#10b981"/> <!-- LED verde indicador -->
    <text x="375" y="26" font-size="5" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" fill="#fff" text-anchor="end">Liquid Retina</text>
  </g>

  <!-- Base Unibody 100% Aluminio Reciclado -->
  <g filter="url(#f-shadow)">
    <rect x="50" y="102" width="366" height="116" rx="6" fill="url(#g-mac-chassis)" stroke="#475569" stroke-width="1"/>

    <!-- Bisagra y Sistema de Altavoces Ocultos / Disipación Pasiva Fanless -->
    <rect x="80" y="98" width="306" height="5" rx="2" fill="#1e2430" stroke="#334155" stroke-width="1"/>
    <!-- Altavoces ocultos tras la bisagra -->
    <line x1="304" y1="100.5" x2="360" y2="100.5" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="2,2"/>

    <!-- Matriz de 3 micrófonos con haz direccional -->
    <circle cx="85" cy="122" r="1" fill="#000"/>
    <circle cx="92" cy="122" r="1" fill="#000"/>
    <circle cx="99" cy="122" r="1" fill="#000"/>

    <!-- Hueco del teclado Magic Keyboard -->
    <rect x="68" y="112" width="330" height="52" rx="4" fill="#12161f" stroke="#334155" stroke-width="1"/>

    <!-- Teclas Magic Keyboard con perfil bajo de tijera -->
    <g fill="#1a1e27" stroke="#334155" stroke-width="0.8">
      <!-- Fila Funciones -->
      <rect x="74" y="116" width="18" height="6" rx="1"/>
      <rect x="94" y="116" width="18" height="6" rx="1"/>
      <rect x="114" y="116" width="18" height="6" rx="1"/>
      <rect x="134" y="116" width="18" height="6" rx="1"/>
      <rect x="154" y="116" width="18" height="6" rx="1"/>
      <rect x="174" y="116" width="18" height="6" rx="1"/>
      <rect x="194" y="116" width="18" height="6" rx="1"/>
      <rect x="214" y="116" width="18" height="6" rx="1"/>
      <rect x="234" y="116" width="18" height="6" rx="1"/>
      <rect x="254" y="116" width="18" height="6" rx="1"/>
      <rect x="274" y="116" width="18" height="6" rx="1"/>
      <rect x="294" y="116" width="18" height="6" rx="1"/>
      <rect x="314" y="116" width="18" height="6" rx="1"/>
      <rect x="334" y="116" width="18" height="6" rx="1"/>

      <!-- Tecla Touch ID con sensor biométrico dactilar -->
      <rect x="364" y="114" width="18" height="18" rx="3" fill="#000000" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="373" cy="123" r="3.2" fill="none" stroke="#94a3b8" stroke-width="1"/>

      <!-- Filas QWERTY principales -->
      <rect x="74" y="124" width="18" height="8" rx="1"/>
      <rect x="94" y="124" width="18" height="8" rx="1"/>
      <rect x="114" y="124" width="18" height="8" rx="1"/>
      <rect x="134" y="124" width="18" height="8" rx="1"/>
      <rect x="154" y="124" width="18" height="8" rx="1"/>
      <rect x="174" y="124" width="18" height="8" rx="1"/>
      <rect x="194" y="124" width="18" height="8" rx="1"/>
      <rect x="214" y="124" width="18" height="8" rx="1"/>
      <rect x="234" y="124" width="18" height="8" rx="1"/>
      <rect x="254" y="124" width="18" height="8" rx="1"/>
      <rect x="274" y="124" width="18" height="8" rx="1"/>
      <rect x="294" y="124" width="18" height="8" rx="1"/>
      <rect x="314" y="124" width="18" height="8" rx="1"/>
      <rect x="334" y="124" width="26" height="8" rx="1"/>

      <rect x="74" y="134" width="22" height="8" rx="1"/>
      <rect x="98" y="134" width="18" height="8" rx="1"/>
      <rect x="118" y="134" width="18" height="8" rx="1"/>
      <rect x="138" y="134" width="18" height="8" rx="1"/>
      <rect x="158" y="134" width="18" height="8" rx="1"/>
      <rect x="178" y="134" width="18" height="8" rx="1"/>
      <rect x="198" y="134" width="18" height="8" rx="1"/>
      <rect x="218" y="134" width="18" height="8" rx="1"/>
      <rect x="238" y="134" width="18" height="8" rx="1"/>
      <rect x="258" y="134" width="18" height="8" rx="1"/>
      <rect x="278" y="134" width="18" height="8" rx="1"/>
      <rect x="298" y="134" width="18" height="8" rx="1"/>
      <rect x="318" y="134" width="18" height="8" rx="1"/>
      <rect x="338" y="134" width="22" height="8" rx="1"/>

      <!-- Fila inferior y espaciador -->
      <rect x="74" y="144" width="26" height="8" rx="1"/>
      <rect x="102" y="144" width="18" height="8" rx="1"/>
      <rect x="122" y="144" width="18" height="8" rx="1"/>
      <rect x="142" y="144" width="18" height="8" rx="1"/>
      <rect x="162" y="144" width="18" height="8" rx="1"/>
      <rect x="182" y="144" width="18" height="8" rx="1"/>
      <rect x="202" y="144" width="18" height="8" rx="1"/>
      <rect x="222" y="144" width="18" height="8" rx="1"/>
      <rect x="242" y="144" width="18" height="8" rx="1"/>
      <rect x="262" y="144" width="18" height="8" rx="1"/>
      <rect x="282" y="144" width="18" height="8" rx="1"/>
      <rect x="302" y="144" width="18" height="8" rx="1"/>
      <rect x="322" y="144" width="38" height="8" rx="1"/>

      <rect x="74" y="154" width="20" height="8" rx="1"/>
      <rect x="96" y="154" width="18" height="8" rx="1"/>
      <rect x="116" y="154" width="22" height="8" rx="1"/>
      <rect x="140" y="154" width="120" height="8" rx="1" fill="#242c3d"/>
      <rect x="262" y="154" width="22" height="8" rx="1"/>
      <rect x="286" y="154" width="18" height="8" rx="1"/>
      <rect x="306" y="154" width="18" height="8" rx="1"/>
      <rect x="326" y="154" width="34" height="8" rx="1"/>
    </g>

    <!-- Trackpad Force Touch Ampliado con Taptic Engine -->
    <rect x="180" y="170" width="106" height="44" rx="5" fill="#181d28" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- 2. PANELES LATERALES DE CONECTORES AMPLIADOS -->
  <text x="14" y="238" font-size="7" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" fill="#ff8533">PERFIL LATERAL IZQUIERDO (CONECTORES)</text>
  <rect x="10" y="242" width="446" height="60" rx="6" fill="url(#g-rail)" stroke="#334155" stroke-width="1"/>

  <!-- MagSafe 3 Magnético (x=36, y=256, w=44, h=22) -->
  <g>
    <rect x="36" y="256" width="44" height="22" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="39" y="259" width="38" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- 5 Pines dorados simétricos -->
    <circle cx="44" cy="267" r="1.8" fill="url(#g-gold)" stroke="#b45309" stroke-width="0.6"/>
    <circle cx="51" cy="267" r="1.8" fill="url(#g-gold)" stroke="#b45309" stroke-width="0.6"/>
    <circle cx="58" cy="267" r="1.8" fill="url(#g-gold)" stroke="#b45309" stroke-width="0.6"/>
    <circle cx="65" cy="267" r="1.8" fill="url(#g-gold)" stroke="#b45309" stroke-width="0.6"/>
    <circle cx="72" cy="267" r="1.8" fill="url(#g-gold)" stroke="#b45309" stroke-width="0.6"/>
    <!-- LED MagSafe -->
    <circle cx="58" cy="252" r="1.6" fill="#10b981" stroke="#059669" stroke-width="0.8"/>
    <text x="58" y="289" font-size="5.5" font-family="sans-serif" font-weight="bold" fill="#cbd5e1" text-anchor="middle">MagSafe 3</text>
  </g>

  <!-- Puerto Thunderbolt / USB4 #1 (40 Gb/s) (x=120, y=258, w=36, h=18) -->
  <g>
    <rect x="120" y="258" width="36" height="18" rx="5" fill="#0a0e17" stroke="#94a3b8" stroke-width="1"/>
    <rect x="124" y="265.5" width="28" height="3" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <rect x="127" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <rect x="133" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <rect x="139" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <rect x="145" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <text x="138" y="286" font-size="5" font-family="sans-serif" font-weight="bold" fill="#38bdf8" text-anchor="middle">⚡ TB4 #1</text>
  </g>

  <!-- Puerto Thunderbolt / USB4 #2 (40 Gb/s) (x=196, y=258, w=36, h=18) -->
  <g>
    <rect x="196" y="258" width="36" height="18" rx="5" fill="#0a0e17" stroke="#94a3b8" stroke-width="1"/>
    <rect x="200" y="265.5" width="28" height="3" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <rect x="203" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <rect x="209" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <rect x="215" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <rect x="221" y="266" width="3" height="2" fill="url(#g-gold)"/>
    <text x="214" y="286" font-size="5" font-family="sans-serif" font-weight="bold" fill="#38bdf8" text-anchor="middle">⚡ TB4 #2</text>
  </g>

  <!-- PERFIL LATERAL DERECHO -->
  <text x="14" y="314" font-size="7" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" fill="#ff8533">PERFIL LATERAL DERECHO (CONECTORES)</text>
  <rect x="10" y="318" width="446" height="60" rx="6" fill="url(#g-rail)" stroke="#334155" stroke-width="1"/>

  <!-- Toma Audio 3.5 mm Alta Impedancia (x=36, y=329, w=26, h=26) -->
  <g>
    <rect x="36" y="329" width="26" height="26" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <circle cx="49" cy="342" r="10" fill="#1e293b" stroke="url(#g-gold)" stroke-width="1.2"/>
    <circle cx="49" cy="342" r="3.5" fill="#000000"/>
    <text x="49" y="364" font-size="5" font-family="sans-serif" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Jack 3.5 Hi-Fi</text>
  </g>

  <text x="100" y="348" font-size="6.5" font-family="'Outfit', 'Inter', sans-serif" font-weight="bold" fill="#94a3b8">CHASIS ULTRAFINO UNIBODY (11.3 MM) · ARQUITECTURA FANLESS 100% SILENCIOSA</text>
</svg>
